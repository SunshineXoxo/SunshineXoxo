
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23B9A3FF&color_dots=%23101820,%23064E3B,%23047857,%2334D399,%23B9A3FF
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23B9A3FF&color_dots=%23101820,%23064E3B,%23047857,%2334D399,%23B9A3FF

      - name: Publish generated animation
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
